# Review CI only. No environment, secrets, SSH, database access, or deployment.
name: Fabric V2 review build (no deploy)

on:
  push:
    branches:
      - master
      - codex/fabric-single-root-20261024
      - codex/fabric-v2-integration-review-20261017
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: fabric-v2-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Offline verify and compile
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: 'true'
      FABRIC_TEST_CONCURRENCY: '2'
    steps:
      - name: Checkout immutable commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Node 24 with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install exactly locked dependencies
        run: npm ci

      - name: Verify review-only CI contract
        run: |
          node scripts/check-v2-remote-ci.mjs
          node --test scripts/check-v2-remote-ci.test.mjs

      - name: Verify pinned security patch and audit reporter contracts
        run: node --test scripts/check-fabric-v2-dependency-baseline.test.mjs scripts/report-fabric-v2-dependency-audit.test.mjs

      - name: Verify COS 3 installed SDK constructor, Promise methods and offline signed URLs
        run: node --test scripts/check-fabric-v2-cos-sdk-v3.test.mjs

      - name: Validate patched HTTP upload and image processing compatibility
        run: node --test scripts/check-fabric-v2-patched-http-image.test.mjs

      - name: Report production dependency risk (review-only, not a deploy gate)
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --json > "$RUNNER_TEMP/fabric-v2-production-audit.json"
          result=$?
          set -e
          if [ "$result" -gt 1 ]; then
            echo "npm audit unavailable (cannot certify security risk)" >&2
            exit "$result"
          fi
          node scripts/report-fabric-v2-dependency-audit.mjs "$RUNNER_TEMP/fabric-v2-production-audit.json"

      - name: TypeScript backend shard
        run: node --max-old-space-size=1200 node_modules/typescript/bin/tsc -p scripts/tsconfig-ci-backend.json --noEmit

      - name: TypeScript frontend shard
        run: node --max-old-space-size=1200 node_modules/typescript/bin/tsc -p scripts/tsconfig-ci-frontend.json --noEmit

      - name: TypeScript tooling shard
        run: node --max-old-space-size=1200 node_modules/typescript/bin/tsc -p scripts/tsconfig-ci-tooling.json --noEmit

      - name: TypeScript V2 fulfillment and public-share boundary
        run: node --max-old-space-size=1200 node_modules/typescript/bin/tsc -p scripts/tsconfig-b3-fulfillment.json --noEmit

      - name: Offline unit and service HTTP tests
        run: npm run test:unit

      # The full download/pixel QA runs locally in an isolated Windows Edge
      # profile with only synthetic review fixtures. Linux CI syntax-checks it
      # but must NOT run Edge, bind a public server, or touch a real COS/DB.
      - name: Validate OUTPUT-01 Windows browser QA syntax (no browser launch)
        run: node --check scripts/document-output-browser-qa.mjs

      - name: Verify sandbox-only frontend entry and loopback proxy
        run: node --test scripts/check-v2-sandbox-front-config.test.mjs

      - name: Build sandbox frontend into ignored temp, never review artifact
        env:
          FABRIC_V2_SANDBOX_FRONTEND: I_ACKNOWLEDGE_SANDBOX
        run: node node_modules/vite/bin/vite.js build --config scripts/vite-v2-sandbox.config.ts

      - name: Documentation and code evidence links
        run: node scripts/check-fabric-v2-doc-navigation.mjs

      - name: Knowledge authority, topology and no-document-junk gate
        run: npm run knowledge:check

      - name: Pull request knowledge change impact (review candidates)
        if: github.event_name == 'pull_request'
        run: node scripts/fabric-knowledge-graph.mjs changed --base ${{ github.event.pull_request.base.sha }}

      - name: Compile frontend and backend (never start server)
        run: npm run build

      - name: Save review build (no sourcemaps or runtime data)
        uses: actions/upload-artifact@v4
        with:
          name: fabric-v2-review-build-${{ github.sha }}
          path: |
            dist/
            dist-camera/
            !dist-camera/**/*.map
            !dist/*.map
            !dist/**/*.map
          if-no-files-found: error
          retention-days: 7
