server {
    listen 80;
    server_name grandtex.vip;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/fabric-acme; default_type text/plain; }
    location / { return 308 https://grandtex.vip$request_uri; }
}

server {
    listen 443 ssl;
    server_name grandtex.vip;

    # 允许上传大文件（图片）
    ssl_certificate /opt/fabric/ops/tls/grandtex.vip/fullchain.pem;
    ssl_certificate_key /opt/fabric/ops/tls/grandtex.vip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:FabricTLS:10m;
    client_max_body_size 20M;
    include /etc/nginx/snippets/fabric-v2-camera.conf;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/fabric-acme;
        default_type text/plain;
    }

    location / {
        proxy_pass http://127.0.0.1:3008/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 静态文件缓存（加速图片加载）
    location ~* \.(jpg|jpeg|png|gif|ico|css|js)$ {
        proxy_pass http://127.0.0.1:3008;
        expires 30d;
    }
}
